server.port=8080

# La connexion a la base de donnees utilise le nom du service Docker Compose (db)
# comme nom d'hote, grace au reseau interne cree automatiquement par Docker Compose.
spring.datasource.url=jdbc:mysql://${DB_HOST:db}:${DB_PORT:3306}/${DB_NAME:devops_db}
spring.datasource.username=${DB_USER:devops_user}
spring.datasource.password=${DB_PASSWORD:devops_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
